; PlatformIO project configuration
; ME306 Project 1 — CoreXY X-Y Plotter
;
; Scaffold only: interfaces + stubs, no functional implementation yet.
; PID, encoder decode, debouncing, FSM, G-code parsing and trajectory
; generation are all our own modules under src/ — no third-party libs.

[env:megaatmega2560]
platform  = atmelavr
board     = megaatmega2560
framework  = arduino

; Serial for G-code input (D0/D1, USB). Match the host baud.
monitor_speed = 115200
monitor_echo = yes

; Warnings on: this is a teaching project, keep it honest.
build_flags =
  -Wall
  -Wextra
 
; Exclude the test/ folder from the normal firmware build to avoid
; duplicate `setup()`/`loop()` definitions from test sketches.
build_src_filter =
  +<*>
  -<test/**>
